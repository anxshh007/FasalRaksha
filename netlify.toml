# Netlify serves the PWA; the API runs elsewhere (see render.yaml).
#
# The one thing that matters here is the proxy below. The phone fetches `/api/…` relatively and
# sends `credentials: 'same-origin'`; its refresh token is an httpOnly cookie scoped to
# `/api/auth`. Two unrelated domains would break sign-in outright. Proxying `/api/*` from this
# domain to the API keeps the browser on **one** origin, which is what the app was built for.

[build]
  command = "corepack pnpm install --frozen-lockfile && corepack pnpm --filter @fasal/shared build && corepack pnpm --filter @fasal/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24"
  COREPACK_ENABLE_DOWNLOAD_PROMPT = "0"
  # Vite's own `build` is what runs; nothing here is baked into the bundle.
  NPM_FLAGS = "--version"

# ── the API, on this origin ─────────────────────────────────────────────────────────────────
# Replace the host with the API service's own URL. `200` is a proxy, not a redirect: the browser
# never learns the other domain, so the cookie belongs to this one.
[[redirects]]
  from = "/api/*"
  to = "https://fasal-raksha-api.onrender.com/api/:splat"
  status = 200
  force = true

# ── the app shell ───────────────────────────────────────────────────────────────────────────
# Every route the app owns is client-side; anything not on disk is the shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── headers ─────────────────────────────────────────────────────────────────────────────────
# The same posture the API applies to its own responses (helmet, in apps/api/src/http/app.ts):
# the static host has to be told separately, because these files no longer pass through it.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"

# The shell and the worker are re-read every load; the content-hashed files never change.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The grading runtime is fetched lazily, checked against a hash compiled into the app, and cached
# by the app itself. It is content-addressed, so it can be cached hard.
[[headers]]
  for = "/ort/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
