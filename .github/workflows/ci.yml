# Continuous integration: the same steps as `pnpm verify`, on Linux, against a real
# PostgreSQL service container. Any failure fails the build.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          # Ephemeral CI-only container, destroyed with the job; not a credential for anything.
          POSTGRES_PASSWORD: ci-ephemeral-superuser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_SUPERUSER_URL: postgres://postgres:ci-ephemeral-superuser@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (fails at high)
        run: pnpm audit --audit-level high
      - run: pnpm -r run typecheck
      - run: pnpm -r run build
      - run: pnpm -r run test
      - name: Database tests (real PostgreSQL, RLS)
        run: pnpm test:db
      - name: Requirements traceability
        run: node tools/requirements/audit.mjs

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: python -m pip install -r ml/requirements.txt
      - run: python -m pytest ml -q
