<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fasal Raksha — AI-powered farmer & buyer marketplace</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BE%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap');

:root {
  --bg: #07110c;
  --bg-soft: #0b1710;
  --card: #0e1b13;
  --border: rgba(255,255,255,0.09);
  --text: #f4f7f3;
  --muted: #91a097;
  --green: #b9e879;
  --green-dark: #162515;
  --white-soft: rgba(255,255,255,0.055);
  --blue: #7ec4ff;
  --blue-soft: rgba(126,196,255,0.1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  min-height: 100vh;
}
button, input, textarea, select { font-family: inherit; }
button { cursor: pointer; }
a { text-decoration: none; color: inherit; }
::selection { background: rgba(185,232,121,0.35); }
.hidden { display: none !important; }

/* ============ SHARED / NAV ============ */
.navbar {
  width: 100%; height: 76px; padding: 0 6%;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
  background: rgba(7,17,12,0.86);
  backdrop-filter: blur(18px);
  position: sticky; top: 0; z-index: 40;
}
.brand { display: flex; align-items: center; gap: 11px; cursor: pointer; border: none; background: none; color: inherit; }
.brand-icon {
  width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
  border-radius: 12px; background: rgba(185,232,121,0.1);
  border: 1px solid rgba(185,232,121,0.15); font-size: 20px; flex-shrink: 0;
}
.brand-name { font-family: "Manrope", sans-serif; font-size: 16px; font-weight: 800; text-align: left; }
.brand-subtitle { margin-top: 2px; font-size: 8px; letter-spacing: 1.4px; color: var(--muted); text-align: left; }
.nav-links { display: flex; gap: 8px; align-items: center; }
.nav-pill {
  border: 1px solid var(--border); background: transparent; color: var(--muted);
  padding: 9px 15px; border-radius: 9px; font-size: 12px; font-weight: 600; transition: 0.2s;
}
.nav-pill:hover { color: var(--text); background: var(--white-soft); }
.nav-pill.active { color: var(--green); border-color: rgba(185,232,121,0.3); background: rgba(185,232,121,0.08); }
.nav-cta {
  border: 1px solid rgba(185,232,121,0.25); background: rgba(185,232,121,0.08); color: var(--green);
  padding: 10px 17px; border-radius: 9px; font-size: 12px; font-weight: 700;
}
.nav-cta:hover { background: rgba(185,232,121,0.15); }

/* ============ HOME ============ */
.home-page {
  min-height: 100vh;
  background:
    radial-gradient(circle at 75% 15%, rgba(92,153,70,0.14), transparent 28%),
    radial-gradient(circle at 10% 50%, rgba(52,108,59,0.1), transparent 30%),
    var(--bg);
}
.hero-section {
  max-width: 1250px; min-height: 640px; margin: auto; padding: 80px 6%;
  display: grid; grid-template-columns: 1fr 0.9fr; align-items: center; gap: 80px;
}
.hero-left { position: relative; z-index: 2; }
.eyebrow {
  display: inline-flex; align-items: center; gap: 7px; color: var(--green);
  font-size: 10px; letter-spacing: 1.7px; font-weight: 800; margin-bottom: 22px;
}
.eyebrow span { font-size: 13px; }
.hero-left h1 {
  font-family: "Manrope", sans-serif; font-size: clamp(40px, 6vw, 72px);
  line-height: 1.03; letter-spacing: -3px; font-weight: 800;
}
.hero-left h1 span { color: var(--green); }
.hero-text { max-width: 570px; margin-top: 25px; color: var(--muted); line-height: 1.75; font-size: 16px; }
.hero-actions { display: flex; gap: 12px; margin-top: 34px; flex-wrap: wrap; }
.primary-button {
  border: none; background: var(--green); color: #0b1309; padding: 14px 19px; border-radius: 10px;
  font-size: 13px; font-weight: 800; display: inline-flex; align-items: center; gap: 12px; transition: 0.2s;
}
.primary-button:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(185,232,121,0.12); }
.primary-button span { font-size: 17px; }
.primary-button.blue { background: var(--blue); }
.primary-button.blue:hover { box-shadow: 0 12px 30px rgba(126,196,255,0.15); }
.secondary-button {
  padding: 14px 19px; border: 1px solid var(--border); border-radius: 10px; color: #c1cbc5; font-size: 13px; transition: 0.2s;
}
.secondary-button:hover { background: var(--white-soft); }
.trust-row { display: flex; gap: 24px; margin-top: 38px; flex-wrap: wrap; }
.trust-item { color: #718078; font-size: 11px; display: flex; align-items: center; gap: 6px; }

.hero-visual { min-height: 430px; position: relative; display: flex; align-items: center; justify-content: center; }
.glow { position: absolute; width: 330px; height: 330px; border-radius: 50%; background: rgba(112,180,77,0.12); filter: blur(70px); }
.farmer-visual-card {
  width: min(390px, 100%); padding: 24px; position: relative; z-index: 2; border-radius: 22px;
  border: 1px solid rgba(255,255,255,0.1);
  background: linear-gradient(145deg, rgba(24,42,28,0.95), rgba(11,24,16,0.96));
  box-shadow: 0 35px 90px rgba(0,0,0,0.45);
}
.visual-header { display: flex; justify-content: space-between; align-items: center; color: #78877e; font-size: 9px; font-weight: 800; letter-spacing: 1.2px; }
.visual-header > div { display: flex; align-items: center; gap: 7px; }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: #91e36b; }
.visual-header > span { color: var(--green); padding: 5px 8px; background: rgba(185,232,121,0.08); border-radius: 6px; }
.visual-crop { display: flex; align-items: center; gap: 15px; margin-top: 35px; }
.crop-circle { width: 64px; height: 64px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 30px; background: rgba(185,232,121,0.1); border: 1px solid rgba(185,232,121,0.15); }
.visual-crop small { display: block; color: #65736b; font-size: 10px; }
.visual-crop h3 { font-family: "Manrope"; font-size: 21px; margin: 3px 0; }
.visual-crop p { color: #738078; font-size: 11px; }
.visual-divider { height: 1px; background: var(--border); margin: 25px 0; }
.match-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.match-title span { color: #6f7d74; font-size: 9px; letter-spacing: 1.2px; font-weight: 800; }
.match-title strong { color: var(--green); font-size: 21px; }
.preview-buyer { display: flex; align-items: center; gap: 11px; padding: 12px; background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.06); border-radius: 11px; }
.buyer-mini-icon { width: 38px; height: 38px; display: flex; justify-content: center; align-items: center; border-radius: 10px; background: rgba(255,255,255,0.07); }
.preview-buyer strong { display: block; font-size: 11px; }
.preview-buyer small { display: block; color: #68756d; font-size: 9px; margin-top: 3px; }
.price-mini { margin-left: auto; color: var(--green); font-size: 12px; font-weight: 800; }
.preview-details { display: flex; gap: 10px; margin-top: 12px; }
.preview-details span { flex: 1; padding: 9px; text-align: center; border-radius: 8px; background: rgba(255,255,255,0.025); color: #738078; font-size: 9px; }
.ai-bubble { margin-top: 18px; padding: 10px 12px; border-radius: 9px; color: #8ea28f; background: rgba(185,232,121,0.05); font-size: 10px; text-align: center; }
.floating-stat { position: absolute; z-index: 4; padding: 13px 16px; border-radius: 11px; background: rgba(14,28,19,0.94); border: 1px solid var(--border); box-shadow: 0 15px 40px rgba(0,0,0,0.3); }
.floating-stat strong { display: block; color: var(--green); font-family: "Manrope"; font-size: 18px; }
.floating-stat span { display: block; color: #66736c; font-size: 8px; margin-top: 2px; }
.stat-one { top: 10%; left: -4%; }
.stat-two { right: -4%; bottom: 12%; }

.section { max-width: 1150px; margin: auto; padding: 100px 6%; }
.section-heading { max-width: 650px; margin-bottom: 55px; }
.section-heading h2 { font-family: "Manrope"; font-size: clamp(30px, 4vw, 46px); line-height: 1.08; letter-spacing: -2px; margin-bottom: 17px; }
.section-heading h2 span { color: var(--green); }
.section-heading > p { color: var(--muted); line-height: 1.7; font-size: 14px; }

.steps { display: flex; align-items: stretch; gap: 18px; flex-wrap: wrap; }
.step-card { flex: 1; min-width: 220px; padding: 25px; border-radius: 16px; border: 1px solid var(--border); background: rgba(255,255,255,0.025); position: relative; }
.step-number { color: #526059; font-size: 10px; font-weight: 800; letter-spacing: 1px; }
.step-icon { font-size: 27px; margin: 35px 0 18px; }
.step-card h3 { font-family: "Manrope"; font-size: 17px; margin-bottom: 9px; }
.step-card p { color: var(--muted); font-size: 12px; line-height: 1.6; }

.features-section { border-top: 1px solid var(--border); }
.feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.feature-card { padding: 28px; border-radius: 17px; border: 1px solid var(--border); background: rgba(255,255,255,0.025); }
.feature-card.large { grid-row: span 2; }
.feature-card.wide { display: flex; gap: 20px; align-items: flex-start; }
.feature-icon { width: 43px; height: 43px; display: flex; justify-content: center; align-items: center; border-radius: 11px; background: rgba(185,232,121,0.08); font-size: 20px; margin-bottom: 22px; }
.feature-card h3 { font-family: "Manrope"; font-size: 17px; margin-bottom: 10px; }
.feature-card p { color: var(--muted); font-size: 12px; line-height: 1.65; }
.language-pills { display: flex; gap: 7px; margin-top: 28px; flex-wrap: wrap; }
.language-pills span { padding: 8px 11px; border-radius: 8px; background: rgba(255,255,255,0.05); color: #9ca8a1; font-size: 10px; }

/* ROLE PICKER */
.role-section { border-top: 1px solid var(--border); }
.role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.role-card {
  padding: 34px; border-radius: 20px; border: 1px solid var(--border); background: rgba(255,255,255,0.025);
  text-align: left; transition: 0.2s; display: flex; flex-direction: column; gap: 14px; color: inherit;
}
.role-card:hover { transform: translateY(-3px); border-color: rgba(185,232,121,0.25); background: rgba(255,255,255,0.04); }
.role-card .role-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 26px; background: rgba(185,232,121,0.1); }
.role-card.buyer .role-icon { background: var(--blue-soft); }
.role-card h3 { font-family: "Manrope"; font-size: 20px; }
.role-card p { color: var(--muted); font-size: 13px; line-height: 1.6; }
.role-card .role-go { margin-top: auto; color: var(--green); font-size: 12px; font-weight: 800; }
.role-card.buyer .role-go { color: var(--blue); }

.final-cta { padding: 100px 20px; text-align: center; border-top: 1px solid var(--border); background: radial-gradient(circle at center, rgba(92,153,70,0.12), transparent 50%); }
.cta-leaf { font-size: 30px; }
.final-cta h2 { font-family: "Manrope"; font-size: clamp(32px, 5vw, 52px); line-height: 1.05; letter-spacing: -2px; margin: 18px 0; }
.final-cta p { color: var(--muted); margin-bottom: 27px; }
.final-cta-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

footer { max-width: 1150px; margin: auto; padding: 35px 6% 50px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 30px; flex-wrap: wrap; }
.footer-brand { display: flex; align-items: center; gap: 10px; }
.footer-brand strong { display: block; font-size: 13px; }
.footer-brand span { display: block; color: #65716a; font-size: 9px; margin-top: 2px; }
footer > p.footer-note { color: #647069; font-size: 10px; margin-left: auto; max-width: 340px; line-height: 1.6; }
.footer-copy { color: #4e5953; font-size: 9px; }
.footer-links { display: flex; gap: 14px; }
.footer-links button { background: none; border: none; color: #7d8b83; font-size: 10px; text-decoration: underline; }
.footer-links button:hover { color: var(--green); }

/* ============ DASHBOARD SHARED ============ */
.dashboard-page { min-height: 100vh; background: radial-gradient(circle at 50% 0, rgba(93,156,69,0.13), transparent 34%), var(--bg); }
.dashboard-page.buyer-theme { background: radial-gradient(circle at 50% 0, rgba(69,120,156,0.16), transparent 34%), var(--bg); }
.dashboard-main { max-width: 960px; margin: auto; padding: 55px 20px 110px; }
.dashboard-intro { text-align: center; margin-bottom: 42px; }
.tagline { color: #68766e; font-size: 10px; letter-spacing: 1.8px; font-weight: 800; margin-bottom: 10px; }
.dashboard-intro h1 { font-family: "Manrope"; font-size: clamp(34px, 6vw, 54px); letter-spacing: -2px; line-height: 1.06; }
.dashboard-intro h1 span { color: var(--green); }
.buyer-theme .dashboard-intro h1 span { color: var(--blue); }
.dashboard-intro p { color: var(--muted); margin-top: 17px; font-size: 14px; max-width: 520px; margin-left: auto; margin-right: auto; }

.panel { padding: 28px; border: 1px solid var(--border); border-radius: 20px; background: rgba(255,255,255,0.035); box-shadow: 0 30px 80px rgba(0,0,0,0.25); margin-bottom: 26px; }
.panel-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px; gap: 12px; flex-wrap: wrap; }
.panel-top h2 { font-family: "Manrope"; font-size: 19px; }
.panel-top p { color: #68766e; font-size: 11px; margin-top: 5px; }
.badge-soft { padding: 7px 10px; border-radius: 20px; background: rgba(185,232,121,0.05); color: #74836f; font-size: 9px; white-space: nowrap; }
.buyer-theme .badge-soft { background: rgba(126,196,255,0.07); color: #7fa1b7; }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 11px; font-weight: 700; margin-bottom: 8px; color: #b6c0ba; }
.form-group .hint { display: block; color: #5e6c64; font-size: 9px; margin-top: 6px; font-weight: 400; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; border: 1px solid var(--border); border-radius: 10px; outline: none; color: white;
  background: rgba(0,0,0,0.2); transition: 0.2s; height: 47px; padding: 0 13px; font-size: 12.5px;
}
.form-group textarea { min-height: 120px; padding: 13px; resize: vertical; height: auto; line-height: 1.6; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: rgba(185,232,121,0.35); box-shadow: 0 0 0 3px rgba(185,232,121,0.06); }
.buyer-theme .form-group input:focus, .buyer-theme .form-group select:focus, .buyer-theme .form-group textarea:focus { border-color: rgba(126,196,255,0.4); box-shadow: 0 0 0 3px rgba(126,196,255,0.07); }
.form-group select option { background: #101b14; }

.action-button {
  width: 100%; border: none; border-radius: 10px; background: var(--green); color: #091009; padding: 14px;
  font-size: 12.5px; font-weight: 800; display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.2s;
}
.action-button:hover { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(185,232,121,0.12); }
.action-button:disabled { opacity: 0.6; cursor: wait; transform: none; }
.action-button.secondary { background: transparent; border: 1px solid var(--border); color: #cfd8d2; }
.action-button.secondary:hover { background: var(--white-soft); box-shadow: none; }
.action-button.blue { background: var(--blue); color: #051019; }
.action-button.blue:hover { box-shadow: 0 12px 35px rgba(126,196,255,0.18); }
.action-button.danger { background: transparent; border: 1px solid rgba(255,120,120,0.25); color: #ff9a9a; }
.action-button.danger:hover { background: rgba(255,90,90,0.08); }
.button-row { display: flex; gap: 10px; flex-wrap: wrap; }
.button-row .action-button { width: auto; flex: 1; min-width: 140px; }

.spinner { width: 14px; height: 14px; border: 2px solid rgba(0,0,0,0.25); border-top-color: #091009; border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.error-message { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: rgba(255,90,90,0.08); border: 1px solid rgba(255,120,120,0.2); color: #ffb3b3; font-size: 12px; }
.info-message { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: rgba(185,232,121,0.06); border: 1px solid rgba(185,232,121,0.15); color: #b7c9ae; font-size: 12px; }
.buyer-theme .info-message { background: rgba(126,196,255,0.07); border-color: rgba(126,196,255,0.2); color: #b8d3e5; }

.understanding-card { margin-top: 22px; padding: 22px; border-radius: 16px; border: 1px solid rgba(185,232,121,0.14); background: rgba(185,232,121,0.035); }
.understanding-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
.understanding-top h3 { font-family: "Manrope"; font-size: 16px; }
.ai-ready { display: flex; align-items: center; gap: 6px; color: #9bb88d; font-size: 9px; }
.ai-ready span.dot { width: 6px; height: 6px; border-radius: 50%; background: #8ce066; display: inline-block; }
.understanding-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.understanding-grid > div { padding: 13px; border-radius: 10px; background: rgba(255,255,255,0.035); }
.understanding-grid small { display: block; color: #69766f; font-size: 9px; margin-bottom: 6px; }
.understanding-grid strong { font-size: 12.5px; }
.understanding-note { margin-top: 14px; color: #6f8074; font-size: 10.5px; line-height: 1.6; }

.matches-section { margin-top: 12px; }
.matches-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
.matches-header h2 { font-family: "Manrope"; font-size: 24px; margin-bottom: 5px; }
.matches-header p { color: #68766e; font-size: 11px; }
.match-total { padding: 8px 12px; border: 1px solid var(--border); border-radius: 20px; color: #7c8981; font-size: 9px; white-space: nowrap; }

.listing-card { position: relative; padding: 21px; margin-bottom: 13px; border-radius: 16px; border: 1px solid var(--border); background: rgba(255,255,255,0.025); transition: 0.25s; }
.listing-card:hover { transform: translateY(-2px); border-color: rgba(185,232,121,0.2); background: rgba(255,255,255,0.035); }
.buyer-theme .listing-card:hover { border-color: rgba(126,196,255,0.25); }
.listing-card.best { border-color: rgba(185,232,121,0.18); background: linear-gradient(135deg, rgba(185,232,121,0.055), rgba(255,255,255,0.025)); }
.buyer-theme .listing-card.best { border-color: rgba(126,196,255,0.22); background: linear-gradient(135deg, rgba(126,196,255,0.06), rgba(255,255,255,0.025)); }
.best-badge { position: absolute; top: -9px; left: 20px; padding: 4px 9px; border-radius: 5px; background: var(--green); color: #0a1108; font-size: 8px; font-weight: 800; letter-spacing: 0.6px; }
.buyer-theme .best-badge { background: var(--blue); color: #051019; }
.listing-main { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.listing-identity { display: flex; align-items: center; gap: 12px; }
.listing-avatar { width: 46px; height: 46px; display: flex; justify-content: center; align-items: center; border-radius: 12px; background: rgba(255,255,255,0.06); font-size: 20px; flex-shrink: 0; }
.listing-identity h3 { font-family: "Manrope"; font-size: 14px; }
.listing-identity p { color: #65726b; font-size: 10px; margin-top: 4px; }
.match-score { text-align: right; }
.match-score strong { display: block; color: var(--green); font-family: "Manrope"; font-size: 22px; }
.buyer-theme .match-score strong { color: var(--blue); }
.match-score span { color: #617068; font-size: 8px; }
.listing-info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin: 18px 0; }
.listing-info-grid > div { padding: 11px; border-radius: 9px; background: rgba(255,255,255,0.03); }
.listing-info-grid span { display: block; color: #647169; font-size: 9px; margin-bottom: 5px; }
.listing-info-grid strong { font-size: 11px; }
.listing-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.contact-button { flex: 1; min-width: 130px; padding: 10px; border-radius: 9px; border: 1px solid rgba(185,232,121,0.15); background: rgba(185,232,121,0.06); color: #a8c98d; font-size: 10.5px; font-weight: 800; transition: 0.2s; }
.contact-button:hover { background: rgba(185,232,121,0.1); border-color: rgba(185,232,121,0.25); }
.buyer-theme .contact-button { border-color: rgba(126,196,255,0.2); background: rgba(126,196,255,0.07); color: #a9cfe5; }
.buyer-theme .contact-button:hover { background: rgba(126,196,255,0.12); border-color: rgba(126,196,255,0.3); }
.remove-button { padding: 10px 12px; border-radius: 9px; border: 1px solid rgba(255,120,120,0.18); background: transparent; color: #d38f8f; font-size: 10.5px; }
.remove-button:hover { background: rgba(255,90,90,0.08); }

<script>
(function(){
"use strict";

/* =========================================================
   DATA LAYER — replaces the FastAPI + SQLite backend.
   Everything lives in localStorage on this device.
========================================================= */
var DB_KEY = "fasalraksha_db_v2";
var SETTINGS_KEY = "fasalraksha_settings_v1";

function defaultDB(){
  return {
    buyers: [
      { id: 1, name: "Sharma Agro Traders", crop: "Wheat", price: 2700, quantity: 500, location: "Kolkata", contact: "sharma.agro@example.com", phone: "+91 98300 11223" },
      { id: 2, name: "Green Harvest Pvt. Ltd.", crop: "Wheat", price: 2600, quantity: 300, location: "Kolkata", contact: "contact@greenharvest.example.com", phone: "+91 98301 44556" },
      { id: 3, name: "Eastern Grain Market", crop: "Wheat", price: 2550, quantity: 200, location: "Kolkata", contact: "sales@easterngrain.example.com", phone: "+91 98302 77889" }
    ],
    listings: [
      { id: 1, farmerName: "Ramesh Kumar", crop: "Wheat", quantity: 400, price: 2500, location: "Kolkata", contact: "+91 98765 43210", note: "Freshly harvested, ready for pickup this week.", createdAt: Date.now() - 86400000 * 2 },
      { id: 2, farmerName: "Anita Devi", crop: "Rice", quantity: 250, price: 3100, location: "Howrah", contact: "+91 91234 56780", note: "Basmati paddy, can arrange transport.", createdAt: Date.now() - 86400000 }
    ],
    nextBuyerId: 4,
    nextListingId: 3,
    myBuyerProfileId: null,
    farmers: [],
    nextFarmerId: 1
  };
}

function loadDB(){
  try {
    var raw = localStorage.getItem(DB_KEY);
    if (!raw) { var seeded = defaultDB(); saveDB(seeded); return seeded; }
    var parsed = JSON.parse(raw);
    if (!parsed.buyers || !parsed.listings) return defaultDB();
    if (!parsed.farmers) parsed.farmers = [];
    if (!parsed.nextFarmerId) parsed.nextFarmerId = 1;
    return parsed;
  } catch (e) { return defaultDB(); }
}
function saveDB(db){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }

function loadSettings(){
  try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveSettings(s){ localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }

/* ---------------------------------------------------------
   SESSION (which farmer, if any, is currently signed in)
--------------------------------------------------------- */
var SESSION_KEY = "fasalraksha_session_v1";
function loadSession(){
  try { return JSON.parse(localStorage.getItem(SESSION_KEY)) || null; }
  catch(e){ return null; }
}
function saveSession(s){ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
function clearSession(){ localStorage.removeItem(SESSION_KEY); }

var db = loadDB();
var settings = loadSettings();
var session = loadSession();

/* ---------------------------------------------------------
   MOCK GOVERNMENT FARMER REGISTRY
   ---------------------------------------------------------
   DEMO DATA ONLY. This stands in for a real government farmer
   database (e.g. a PM-KISAN / state Agristack beneficiary
   lookup) so the sign-up flow below has something real to
   verify against inside a single offline HTML file.

   IMPORTANT — in a production deployment this whole lookup
   must move server-side: a browser should never hold a
   government API key or call a government verification
   endpoint directly. The real flow would be:
     1. Farmer submits their Farmer ID from this page.
     2. Your backend calls the government registry/eKYC API
        (with proper auth, over HTTPS, with the farmer's
        consent) and gets back a verified name/state/district.
     3. Your backend returns only a verified/not-verified
        result (plus the minimum needed profile fields) to
        this page — never the raw government dataset.
--------------------------------------------------------- */
var GOV_FARMER_REGISTRY = [
  { farmerId: "PMK-WB-2201-04871", name: "Ramesh Kumar", state: "West Bengal", district: "Howrah" },
  { farmerId: "PMK-WB-2201-05532", name: "Anita Devi", state: "West Bengal", district: "Howrah" },
  { farmerId: "PMK-UP-1904-11290", name: "Suresh Yadav", state: "Uttar Pradesh", district: "Lucknow" },
  { farmerId: "PMK-PB-1102-08823", name: "Gurpreet Singh", state: "Punjab", district: "Amritsar" },
  { farmerId: "PMK-BR-2005-03345", name: "Meena Kumari", state: "Bihar", district: "Patna" },
  { farmerId: "PMK-MH-1607-09981", name: "Vijay Patil", state: "Maharashtra", district: "Pune" }
];

function verifyFarmerIdWithGovDB(farmerId, callback){
  // Simulated network round-trip to a government verification service.
  setTimeout(function(){
    var clean = (farmerId || "").toString().trim().toUpperCase();
    var match = GOV_FARMER_REGISTRY.find(function(r){ return r.farmerId.toUpperCase() === clean; });
    callback(match || null);
  }, 1100);
}

function getLoggedInFarmer(){
  if (!session || !session.farmerId) return null;
  return db.farmers.find(function(f){ return f.id === session.farmerId; }) || null;
}

/* =========================================================
   CROP / LOCATION DICTIONARIES for the local "AI" parser
========================================================= */
var CROPS = [
  { key: "wheat", label: "Wheat", icon: "🌾", syn: ["wheat","gehu","gehun","gehoon","gom","kanak"] },
  { key: "rice", label: "Rice", icon: "🌾", syn: ["rice","chawal","chaal","dhan","paddy","chal"] },
  { key: "maize", label: "Maize", icon: "🌽", syn: ["maize","corn","makka","makai","bhutta"] },
  { key: "potato", label: "Potato", icon: "🥔", syn: ["potato","potatoes","aloo","alu"] },
  { key: "onion", label: "Onion", icon: "🧅", syn: ["onion","onions","pyaz","piyaj","peyaj"] },
  { key: "tomato", label: "Tomato", icon: "🍅", syn: ["tomato","tomatoes","tamatar"] },
  { key: "sugarcane", label: "Sugarcane", icon: "🎋", syn: ["sugarcane","ganna","akh","aakh"] },
  { key: "cotton", label: "Cotton", icon: "☁️", syn: ["cotton","kapas","tula"] },
  { key: "mustard", label: "Mustard", icon: "🌼", syn: ["mustard","sarson","sorisha"] },
  { key: "soybean", label: "Soybean", icon: "🫘", syn: ["soybean","soya","soyabean"] },
  { key: "groundnut", label: "Groundnut", icon: "🥜", syn: ["groundnut","peanut","peanuts","moongfali","badam"] },
  { key: "gram", label: "Gram (Chana)", icon: "🫛", syn: ["gram","chana","chola"] },
  { key: "pulses", label: "Pulses (Dal)", icon: "🍲", syn: ["pulses","dal","daal","dhal"] },
  { key: "jute", label: "Jute", icon: "🌿", syn: ["jute","paat"] },
  { key: "tea", label: "Tea", icon: "🍃", syn: ["tea","chai"] }
];
var CITIES = ["Kolkata","Delhi","Mumbai","Pune","Bengaluru","Bangalore","Chennai","Hyderabad","Lucknow","Patna",
  "Bhopal","Nagpur","Amritsar","Ludhiana","Jaipur","Ahmedabad","Surat","Kanpur","Indore","Guwahati",
  "Bhubaneswar","Ranchi","Siliguri","Howrah","Durgapur","Asansol"];

function findCropInText(lower){
  for (var i=0;i<CROPS.length;i++){
    var c = CROPS[i];
    for (var j=0;j<c.syn.length;j++){
      var re = new RegExp("\\b"+c.syn[j]+"\\b","i");
      if (re.test(lower)) return c;
    }
  }
  return null;
}
function findCityInText(lower){
  for (var i=0;i<CITIES.length;i++){
    if (lower.indexOf(CITIES[i].toLowerCase()) !== -1) return CITIES[i];
  }
  return null;
}
function normCrop(v){ return (v||"").toString().trim().toLowerCase(); }

/* Local rule-based "AI understanding" — runs entirely offline in the browser. */
function parseCropMessage(text, fallbackLocation){
  var lower = " " + text.toLowerCase() + " ";
  var crop = findCropInText(lower);

  var qty = null;
  var qm = lower.match(/(\d+(?:[.,]\d+)?)\s*(kg|kilo|kilogram|kilograms|quintal|quintals|qtl|ton|tonne|tonnes)/i);
  if (qm){
    var n = parseFloat(qm[1].replace(",",""));
    var unit = qm[2].toLowerCase();
    if (unit.indexOf("quintal") !== -1 || unit === "qtl") n = n * 100;
    else if (unit.indexOf("ton") !== -1) n = n * 1000;
    qty = Math.round(n);
  }

  var price = null;
  var pm = lower.match(/(?:₹|rs\.?|inr)\s?(\d[\d,]*(?:\.\d+)?)/i);
  if (!pm) pm = lower.match(/(\d[\d,]*(?:\.\d+)?)\s?(?:rupees?|rupaye|rupaya|taka)/i);
  if (pm) price = Math.round(parseFloat(pm[1].replace(/,/g,"")));

  var location = findCityInText(lower) || fallbackLocation || null;

  var urgent = /(urgent|jaldi|turant|asap|emergency|today|abhi)/i.test(lower);

  return { crop: crop, quantity: qty, price: price, location: location, urgent: urgent, raw: text };
}

/* =========================================================
   MATCHING ENGINE — computed, not hardcoded like the
   original prototype's fixed 94% / 89% / 84%.
========================================================= */
function matchScore(sell, buy){
  var score = 0;
  var sc = normCrop(sell.crop), bc = normCrop(buy.crop);
  if (sc && bc){
    if (sc === bc) score += 45;
    else if (sc.indexOf(bc) !== -1 || bc.indexOf(sc) !== -1) score += 25;
    else score += 5;
  } else score += 15;

  if (sell.location && buy.location){
    if (sell.location.trim().toLowerCase() === buy.location.trim().toLowerCase()) score += 20;
    else score += 8;
  } else score += 10;

  if (buy.price && sell.price){
    var ratio = buy.price / sell.price;
    score += Math.max(0, Math.min(20, ratio * 20));
  } else score += 10;

  if (buy.quantity && sell.quantity){
    var qratio = sell.quantity / buy.quantity;
    score += Math.max(0, Math.min(15, qratio * 15));
  } else score += 8;

  return Math.max(55, Math.min(98, Math.round(score)));
}

/* =========================================================
   SMALL HELPERS
========================================================= */
function esc(s){
  return (s === null || s === undefined) ? "" : String(s).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
/* Safe to drop into: onclick="...write('HERE')..." — a single-quoted JS
   string literal that itself sits inside an HTML attribute.
   Order matters: JS-escape (backslash, then quote) FIRST, then HTML-escape
   the result for the attribute. Escaping in the other order (as the old
   code did via esc(x).replace(/'/g,"\\'")) is a no-op: esc() already turns
   ' into the entity &#39;, so the later regex finds no raw ' left to touch.
   The browser then HTML-decodes &#39; back into a bare ' when it parses the
   attribute, which reintroduces an unescaped quote into the middle of the
   JS string and throws "missing ) after argument list" the moment the
   button is clicked — e.g. any contact value containing an apostrophe. */
function escJsAttr(s){
  s = (s === null || s === undefined) ? "" : String(s);
  s = s.replace(/\\/g, "\\\\").replace(/'/g, "\\'");
  return s.replace(/[&<>"]/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c];
  });
}
function inr(n){
  if (n === null || n === undefined || isNaN(n)) return "—";
  return "₹" + Number(n).toLocaleString("en-IN");
}
function kg(n){
  if (n === null || n === undefined || isNaN(n)) return "—";
  return Number(n).toLocaleString("en-IN") + " kg";
}
function byId(id){ return document.getElementById(id); }
function val(id){ var el = byId(id); return el ? el.value.trim() : ""; }
function numVal(id){ var v = val(id); if (v === "") return null; var n = Number(v); return isNaN(n) ? null : n; }

function toast(msg){
  var wrap = byId("toast-wrap");
  var t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(function(){ t.style.opacity = "0"; t.style.transition = "opacity .3s"; }, 2200);
  setTimeout(function(){ if (t.parentNode) wrap.removeChild(t); }, 2600);
}

/* =========================================================
   APP STATE + ROUTER
========================================================= */
var state = {
  view: "home",           // home | farmer | buyer
  lastResult: null,       // last local-AI parse result (farmer view)
  lastMatches: null,      // last computed buyer matches for farmer message
  showAdvanced: false      // show optional Groq key box
};

function go(view){
  if (view === "farmer" && !getLoggedInFarmer()){
    state.authMode = "signup";
    state.authError = null;
    state.authVerified = null;
    view = "auth";
    toast("Verify your Farmer ID to open the farmer dashboard");
  }
  state.view = view;
  window.scrollTo(0,0);
  render();
}

/* =========================================================
   MODALS
========================================================= */
function closeModal(){ byId("modal-root").innerHTML = ""; }

function openRoleModal(){
  byId("modal-root").innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this) window.__fr.closeModal()">' +
      '<div class="modal-box">' +
        '<div class="modal-top">' +
          '<div><h3>Get started</h3><p class="modal-sub">Are you here to sell a crop, or to buy one?</p></div>' +
          '<button class="icon-btn" onclick="window.__fr.closeModal()">✕</button>' +
        '</div>' +
        '<div class="role-modal-grid">' +
          '<button onclick="window.__fr.closeModal(); window.__fr.go(\'farmer\')">' +
            '<span class="r-icon">👨‍🌾</span><span class="r-label">I\'m a Farmer</span><span class="r-sub">Sell your crop, find buyers</span>' +
          '</button>' +
          '<button onclick="window.__fr.closeModal(); window.__fr.go(\'buyer\')">' +
            '<span class="r-icon">🏪</span><span class="r-label">I\'m a Buyer</span><span class="r-sub">Post demand, find crops</span>' +
          '</button>' +
        '</div>' +
      '</div>' +
    '</div>';
}

function openContactModal(name, sub, contact, phone){
  var lines = "";
  if (contact) lines += '<div class="contact-line"><span>✉️ ' + esc(contact) + '</span><button onclick="navigator.clipboard&&navigator.clipboard.writeText(\'' + escJsAttr(contact) + '\');window.__fr.toast(\'Copied\')">Copy</button></div>';
  if (phone) lines += '<div class="contact-line"><span>📞 ' + esc(phone) + '</span><button onclick="navigator.clipboard&&navigator.clipboard.writeText(\'' + escJsAttr(phone) + '\');window.__fr.toast(\'Copied\')">Copy</button></div>';
  if (!lines) lines = '<div class="contact-line"><span>No contact details on file yet.</span></div>';
  byId("modal-root").innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this) window.__fr.closeModal()">' +
      '<div class="modal-box">' +
        '<div class="modal-top">' +
          '<div><h3>' + esc(name) + '</h3><p class="modal-sub">' + esc(sub) + '</p></div>' +
          '<button class="icon-btn" onclick="window.__fr.closeModal()">✕</button>' +

  var query = state.buyerQuery || "";
  if (query){
    var q = query.toLowerCase();
    listingsToShow = listingsToShow.filter(function(l){
      return l.crop.toLowerCase().indexOf(q) !== -1 || l.location.toLowerCase().indexOf(q) !== -1 || l.farmerName.toLowerCase().indexOf(q) !== -1;
    });
  }

  var ranked = listingsToShow.map(function(l){
    var score = myProfile ? matchScore(l, myProfile) : matchScore(l, {crop:l.crop, price:l.price, quantity:l.quantity, location:l.location});
    return { listing: l, score: myProfile ? score : null };
  });
  if (myProfile) ranked.sort(function(a,b){ return b.score - a.score; });

  if (ranked.length === 0){
    matchesHtml = '<div class="empty-state"><div class="icon">📭</div><h3>No crop listings found</h3><p>' + (query ? "Nothing matches \"" + esc(query) + "\". Try a different search." : "No farmers have listed crops yet. Check back soon.") + '</p></div>';
  } else {
    matchesHtml = ranked.map(function(item, i){
      var l = item.listing;
      var isBest = myProfile && i === 0;
      return '<div class="listing-card' + (isBest ? " best" : "") + '">' +
        (isBest ? '<div class="best-badge">⭐ BEST MATCH</div>' : '') +
        '<div class="listing-main">' +
          '<div class="listing-identity"><div class="listing-avatar">👨‍🌾</div><div><h3>' + esc(l.farmerName) + '</h3><p>Selling ' + esc(l.crop) + '</p></div></div>' +
          (item.score !== null ? '<div class="match-score"><strong>' + item.score + '%</strong><span>Match</span></div>' : '') +
        '</div>' +
        '<div class="listing-info-grid">' +
          '<div><span>💰 Asking Price</span><strong>' + inr(l.price) + '</strong></div>' +
          '<div><span>📍 Location</span><strong>' + esc(l.location) + '</strong></div>' +
          '<div><span>📦 Available</span><strong>' + kg(l.quantity) + '</strong></div>' +
        '</div>' +
        (l.note ? '<p style="font-size:11px;color:#8a978f;margin:-6px 0 16px;">"' + esc(l.note) + '"</p>' : '') +
        '<div class="listing-actions"><button class="contact-button" onclick="window.__fr.contactFarmer(' + l.id + ')">Contact Farmer →</button></div>' +
      '</div>';
    }).join("");
  }

  return '' +
  '<div class="dashboard-page buyer-theme">' +
    navBar("buyer") +
    '<main class="dashboard-main">' +
      '<div class="dashboard-intro">' +
        '<p class="tagline">BUYER DASHBOARD</p>' +
        '<h1>Find the right crop<br><span>from the right farmer.</span></h1>' +
        '<p>Post what you\'re looking to buy, then browse live listings from farmers ranked by fit to your demand.</p>' +
      '</div>' +

      '<div class="panel">' +
        '<div class="panel-top"><div><h2>🏪 ' + (myProfile ? "Your buying profile" : "Post your buying profile") + '</h2><p>This is what farmers see and get matched against.</p></div>' + (myProfile ? '<span class="badge-soft">Live in marketplace</span>' : '') + '</div>' +
        '<div class="form-row">' +
          '<div class="form-group"><label>Business / your name</label><input id="b-name" placeholder="e.g. Sharma Agro Traders" value="' + (myProfile ? esc(myProfile.name) : "") + '" /></div>' +
          '<div class="form-group"><label>Crop you want to buy</label>' +
            '<select id="b-crop">' + CROPS.map(function(c){ return '<option value="' + c.label + '"' + (myProfile && myProfile.crop === c.label ? " selected" : "") + '>' + c.icon + ' ' + c.label + '</option>'; }).join("") + '</select>' +
          '</div>' +
        '</div>' +
        '<div class="form-row">' +
          '<div class="form-group"><label>Quantity needed (kg)</label><input id="b-qty" type="number" min="1" placeholder="e.g. 500" value="' + (myProfile ? myProfile.quantity : "") + '" /></div>' +
          '<div class="form-group"><label>Price you\'re offering (₹ / quintal)</label><input id="b-price" type="number" min="1" placeholder="e.g. 2700" value="' + (myProfile ? myProfile.price : "") + '" /></div>' +
        '</div>' +
        '<div class="form-row">' +
          '<div class="form-group"><label>Location</label><input id="b-location" placeholder="e.g. Kolkata" value="' + (myProfile ? esc(myProfile.location) : "") + '" /></div>' +
          '<div class="form-group"><label>Contact (phone or email)</label><input id="b-contact" placeholder="e.g. buyer@example.com" value="' + (myProfile ? esc(myProfile.contact) : "") + '" /></div>' +
        '</div>' +
        '<div class="button-row">' +
          '<button class="action-button blue" onclick="window.__fr.handleSaveBuyerProfile()">' + (myProfile ? "💾 Update profile" : "📢 Post buying profile") + '</button>' +
          (myProfile ? '<button class="action-button danger" onclick="window.__fr.handleDeleteBuyerProfile()">Remove profile</button>' : '') +
        '</div>' +
        '<div id="b-error"></div>' +
      '</div>' +

      '<div class="matches-section">' +
        '<div class="matches-header">' +
          '<div><p class="tagline">' + (myProfile ? "SMART MATCHING" : "MARKETPLACE") + '</p><h2>🎯 ' + (myProfile ? "Best Crop Matches" : "Browse Crop Listings") + '</h2><p>' + (myProfile ? "Ranked by crop, price, quantity and location fit." : "Post your buying profile above to see ranked matches.") + '</p></div>' +
          '<div class="match-total">' + ranked.length + ' listing' + (ranked.length===1?"":"s") + '</div>' +
        '</div>' +
        '<div class="form-group" style="max-width:340px;"><input id="b-search" placeholder="🔎 Search crop, farmer or location" value="' + esc(query) + '" oninput="window.__fr.handleBuyerSearch(this.value)" /></div>' +
        matchesHtml +
      '</div>' +
    '</main>' +
  '</div>';
}

/* =========================================================
   MAIN RENDER
========================================================= */
function render(){
  var app = byId("app");
  if (state.view === "farmer" && !getLoggedInFarmer()){ state.view = "auth"; }
  if (state.view === "farmer") app.innerHTML = renderFarmer();
  else if (state.view === "buyer") app.innerHTML = renderBuyer();
  else if (state.view === "auth") app.innerHTML = renderAuth();
  else app.innerHTML = renderHome();
}

/* =========================================================
   ACTIONS: FARMER
========================================================= */
function handleFindBuyers(){
  var message = val("f-message");
  var language = val("f-language") || "English";
  byId("f-error").innerHTML = "";

  if (!message){
    byId("f-error").innerHTML = '<div class="error-message">⚠️ Please tell us about your crop first.</div>';
    return;
  }

  var btn = byId("f-find-btn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Finding buyers...';

  var finish = function(result){
    state.lastResult = result;
    var supply = {
      crop: result.crop ? result.crop.label : null,
      quantity: result.quantity,
      price: result.price,
      location: result.location
    };
    var matches = db.buyers.map(function(b){
      return { buyer: b, score: matchScore(supply, b) };
    }).sort(function(a,b){ return b.score - a.score; });
    state.lastMatches = matches;
    render();
    var section = byId("app").querySelector(".matches-section, .understanding-card");
    if (section) section.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  var local = parseCropMessage(message, "Kolkata");

  if (settings.groqApiKey){
    var prompt = "You are an AI assistant for Fasal Raksha, a platform that helps farmers find suitable buyers.\n" +
      "Understand the farmer's message and return a short, clear, farmer-friendly summary covering: crop, quantity, expected price, location, selling requirement. If something is missing, do not invent it.\n\n" +
      "Farmer message: " + message + "\nPreferred language: " + language + "\nLocation: " + (local.location || "Kolkata");

    fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + settings.groqApiKey },
      body: JSON.stringify({
        model: "openai/gpt-oss-20b",
        messages: [
          { role: "system", content: "You are a helpful agricultural AI assistant." },
          { role: "user", content: prompt }
        ],
        temperature: 0.2,
        max_tokens: 300
      })
    }).then(function(res){
      if (!res.ok) throw new Error("groq_error_" + res.status);
      return res.json();
    }).then(function(data){
      var text = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      local.source = "groq";
      local.aiText = text || "The AI didn't return a summary — showing locally parsed details instead.";
      finish(local);
    }).catch(function(err){
      console.warn("Live Groq call failed, falling back to local parser:", err);
      toast("Live AI unavailable — used local parsing instead");
      local.source = "local";
      finish(local);
    }).finally(function(){
      btn.disabled = false;
      btn.innerHTML = "🤖 Find Best Buyers";
    });
  } else {
    setTimeout(function(){
      local.source = "local";
      finish(local);
      btn.disabled = false;
      btn.innerHTML = "🤖 Find Best Buyers";
    }, 350);
  }
}

function handleAddListing(){
  byId("l-error").innerHTML = "";
  var name = val("l-name");
  var crop = val("l-crop");
  var qty = numVal("l-qty");
  var price = numVal("l-price");
  var location = val("l-location");
  var contact = val("l-contact");
  var note = val("l-note");

  if (!name || !crop || !qty || !price || !location){
    byId("l-error").innerHTML = '<div class="error-message">⚠️ Please fill in your name, crop, quantity, price and location.</div>';
    return;
  }

  var listing = { id: db.nextListingId++, farmerName: name, crop: crop, quantity: qty, price: price, location: location, contact: contact, note: note, createdAt: Date.now() };
  db.listings.push(listing);
  saveDB(db);
  toast("Crop listed — buyers can now find you");
  render();
}

function removeListing(id){
  db.listings = db.listings.filter(function(l){ return l.id !== id; });
  saveDB(db);
  toast("Listing removed");
  render();
}

function contactBuyer(id){
  var b = db.buyers.find(function(x){ return x.id === id; });
  if (!b) return;
  openContactModal(b.name, b.crop + " buyer • " + b.location, b.contact, b.phone);
}

function toggleAdvanced(){ state.showAdvanced = !state.showAdvanced; render(); }
function saveGroqKey(){
  var key = val("f-groq-key");
  settings.groqApiKey = key || null;
  saveSettings(settings);
  toast(key ? "Groq key saved to this browser" : "Groq key cleared");
  render();
}
function clearGroqKey(){
  settings.groqApiKey = null;
  saveSettings(settings);
  toast("Groq key removed");
  render();
}

/* =========================================================
   ACTIONS: BUYER
========================================================= */
function handleSaveBuyerProfile(){
  byId("b-error").innerHTML = "";
  var name = val("b-name");
  var crop = val("b-crop");
  var qty = numVal("b-qty");
  var price = numVal("b-price");
  var location = val("b-location");
  var contact = val("b-contact");

  if (!name || !crop || !qty || !price || !location){
    byId("b-error").innerHTML = '<div class="error-message">⚠️ Please fill in your name, crop, quantity, price and location.</div>';
    return;
  }

  if (db.myBuyerProfileId){
    var existing = db.buyers.find(function(b){ return b.id === db.myBuyerProfileId; });
    if (existing){
      existing.name = name; existing.crop = crop; existing.quantity = qty; existing.price = price;
      existing.location = location; existing.contact = contact;
      saveDB(db);
      toast("Profile updated");
      render();
      return;
    }
  }

  var buyer = { id: db.nextBuyerId++, name: name, crop: crop, quantity: qty, price: price, location: location, contact: contact, phone: "" };
  db.buyers.push(buyer);
  db.myBuyerProfileId = buyer.id;
  saveDB(db);
  toast("Buying profile posted — farmers can now match with you");
  render();
}

function handleDeleteBuyerProfile(){
  db.buyers = db.buyers.filter(function(b){ return b.id !== db.myBuyerProfileId; });
  db.myBuyerProfileId = null;
  saveDB(db);
  toast("Profile removed");
  render();
}

function handleBuyerSearch(q){
  state.buyerQuery = q;
  render();
  var input = byId("b-search");
  if (input){ input.focus(); input.selectionStart = input.selectionEnd = input.value.length; }
}

function contactFarmer(id){
  var l = db.listings.find(function(x){ return x.id === id; });
  if (!l) return;
  openContactModal(l.farmerName, "Selling " + l.crop + " • " + l.location, l.contact, "");
}

/* =========================================================
   ACTIONS: FARMER VERIFICATION (SIGN UP / SIGN IN)
========================================================= */
function setAuthMode(mode){
  state.authMode = mode;
  state.authError = null;
  state.authVerified = null;
  render();
}

function resetAuthVerification(){
  state.authVerified = null;
  state.authError = null;
  render();
}

function handleAuthSubmit(){
  state.authError = null;
  var mode = state.authMode || "signup";
  var farmerId = val("a-farmerid");
  var phone = val("a-phone");

  if (mode === "login"){
    if (!farmerId || !phone){
      state.authError = "Enter your Farmer ID and mobile number.";
      render();
      return;
    }
    var found = db.farmers.find(function(f){
      return f.farmerId.toUpperCase() === farmerId.trim().toUpperCase() &&
             f.phone.replace(/\D/g, "") === phone.replace(/\D/g, "");
    });
    if (!found){
      state.authError = "No verified account matches that Farmer ID and mobile number. New here? Use Sign Up.";
      render();
      return;
    }
    session = { farmerId: found.id };
    saveSession(session);
    toast("Welcome back, " + found.name.split(" ")[0]);
    go("farmer");
    return;
  }

  // ---- sign-up mode ----
  var name = val("a-name");
  state.authForm = { name: name, phone: phone, farmerId: farmerId };

  if (!state.authVerified){
    if (!name || !phone || !farmerId){
      state.authError = "Please fill in your name, mobile number and Farmer Verification ID.";
      render();
      return;
    }
    if (db.farmers.some(function(f){ return f.farmerId.toUpperCase() === farmerId.trim().toUpperCase(); })){
      state.authError = "An account already exists for this Farmer ID. Please sign in instead.";
      render();
      return;
    }
    var btn = byId("a-submit-btn");
    if (btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Checking government records...'; }
    verifyFarmerIdWithGovDB(farmerId, function(match){
      if (!match){
        state.authError = "This Farmer ID was not found in government farmer records. Double-check the ID or contact your local agriculture office.";
        state.authVerified = null;
        render();
        return;
      }
      state.authVerified = match;
      state.authError = null;
      render();
    });
    return;
  }

  // already verified against the mock gov DB — create the local account
  if (!name || !phone){
    state.authError = "Please enter your name and mobile number.";
    render();
    return;
  }
  var newFarmer = {
    id: db.nextFarmerId++,
    name: name,
    phone: phone,
    farmerId: farmerId.trim().toUpperCase(),
    state: state.authVerified.state,
    district: state.authVerified.district,
    verifiedAt: Date.now()
  };
  db.farmers.push(newFarmer);
  saveDB(db);
  session = { farmerId: newFarmer.id };
  saveSession(session);
  state.authVerified = null;
  state.authForm = null;
  toast("✅ Verified — welcome to Fasal Raksha, " + name.split(" ")[0]);
  go("farmer");
}

function handleLogout(){
  session = null;
  clearSession();
  toast("Signed out");
  go("home");
}

/* =========================================================
   VOICE INPUT (Web Speech API) — for the farmer chat box
========================================================= */
var recognition = null;
var isListening = false;
var VOICE_LANG_MAP = { "English": "en-IN", "Hindi": "hi-IN", "Bengali": "bn-IN", "Punjabi": "pa-IN" };

function getSpeechRecognitionCtor(){
  return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}

function setMicUI(listening){
  var btn = byId("f-mic-btn");
  var label = byId("f-mic-label");
  if (!btn || !label) return;
  btn.classList.toggle("listening", listening);
  label.textContent = listening ? "⏹️ Listening…" : "🎙️ Speak";
}

function toggleVoiceInput(){
  var SR = getSpeechRecognitionCtor();
  if (!SR){
    toast("🎙️ Voice input isn't supported in this browser — try Chrome on desktop or Android.");
    return;
  }
  if (isListening){
    if (recognition) recognition.stop();
    return;
  }

  var langLabel = val("f-language") || "English";
  var baseText = val("f-message");
  if (baseText && !/\s$/.test(baseText)) baseText += " ";
  var finalTranscript = "";

  recognition = new SR();
  recognition.lang = VOICE_LANG_MAP[langLabel] || "en-IN";
  recognition.interimResults = true;
  recognition.continuous = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = function(){
    isListening = true;
    setMicUI(true);
  };
  recognition.onresult = function(event){
    var interim = "";
    for (var i = event.resultIndex; i < event.results.length; i++){
      var transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) finalTranscript += transcript + " ";
      else interim += transcript;
    }
    var ta = byId("f-message");
    if (ta) ta.value = baseText + finalTranscript + interim;
  };
  recognition.onerror = function(e){
    if (e.error === "not-allowed" || e.error === "service-not-allowed"){
      toast("Microphone access was blocked — please allow mic permission and try again.");
    } else if (e.error !== "no-speech" && e.error !== "aborted"){
      toast("Voice input error — please try again.");
    }
  };
  recognition.onend = function(){
    isListening = false;
    setMicUI(false);
  };

  try { recognition.start(); }
  catch (e) { toast("Couldn't start voice input — please try again."); }
}

/* =========================================================
   MISC
========================================================= */
function resetDemo(){
  if (!confirm("Reset all locally stored buyers, listings, farmer accounts and your profile back to the demo defaults? You'll be signed out.")) return;
  db = defaultDB();
  saveDB(db);
  settings = {};
  saveSettings(settings);
  session = null;
  clearSession();
  if (recognition) { try { recognition.stop(); } catch(e){} }
  state = { view: "home", lastResult: null, lastMatches: null, showAdvanced: false };
  render();
  toast("Demo data reset");
}

/* =========================================================
   EXPOSE + INIT
========================================================= */
window.__fr = {
  go: go,
  openRoleModal: openRoleModal,
  closeModal: closeModal,
  openAboutModal: openAboutModal,
  handleFindBuyers: handleFindBuyers,
  handleAddListing: handleAddListing,
  removeListing: removeListing,
  contactBuyer: contactBuyer,
  toggleAdvanced: toggleAdvanced,
  saveGroqKey: saveGroqKey,
  clearGroqKey: clearGroqKey,
  handleSaveBuyerProfile: handleSaveBuyerProfile,
  handleDeleteBuyerProfile: handleDeleteBuyerProfile,
  handleBuyerSearch: handleBuyerSearch,
  contactFarmer: contactFarmer,
  resetDemo: resetDemo,
  toast: toast,
  setAuthMode: setAuthMode,
  resetAuthVerification: resetAuthVerification,
  handleAuthSubmit: handleAuthSubmit,
  handleLogout: handleLogout,
  toggleVoiceInput: toggleVoiceInput
};

render();
})();
</script>
